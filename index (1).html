function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(d){if(!d)return"";const t=new Date(d);return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`}
function fmtDateKR(d){if(!d)return"";const t=new Date(d);return`${t.getMonth()+1}/${t.getDate()} (${DAYS_KR[t.getDay()]})`}
function isSessionPast(s){const now=new Date(),sd=new Date(s.date+"T00:00:00");if(s.time){const[h,m]=s.time.split(":").map(Number);sd.setHours(h,m)}else sd.setHours(23,59);return sd<now}

function genVirtual(schedules,sessions,weeks=8){
  const v=[];const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<weeks*7;i++){const d=new Date(today);d.setDate(d.getDate()+i);
    schedules.filter(sc=>sc.active).forEach(sc=>{if(d.getDay()!==sc.dayOfWeek)return;
      const start=new Date(sc.startDate);start.setHours(0,0,0,0);if(d<start)return;
      const ds=fmtDate(d);if(!sessions.some(s=>s.studentId===sc.studentId&&s.subject===sc.subject&&s.date===ds))
        v.push({id:`v_${sc.id}_${ds}`,studentId:sc.studentId,subject:sc.subject,date:ds,time:sc.time,status:"scheduled",content:"",nextPlan:"",homework:"",virtual:true});
    });
  }return v;
}

function getSessionNum(s,sessions){
  if(s.virtual||s.status==="cancelled")return null;
  return sessions.filter(x=>x.studentId===s.studentId&&x.subject===s.subject&&(x.status==="completed"||x.status==="makeup"||x.status==="rescheduled")&&(x.date<s.date||(x.date===s.date&&x.id<=s.id))).length;
}

          e("div",null,e("div",{style:{display:"flex",alignItems:"center",gap:6}},e("span",{style:{fontSize:14,fontWeight:600,color:"#0f172a"}},st?.name||"?"," · ",p.subject,p.monthKey?` (${parseInt(p.monthKey.slice(5))}월)`:""),p.auto&&e("span",{style:{fontSize:10,color:"#94a3b8",background:"#f1f5f9",padding:"1px 5px",borderRadius:4}},"자동")),
            e("div",{style:{fontSize:12,color:"#64748b",marginTop:2}},p.sessionCount+"회 · "+p.amount.toLocaleString()+"원 · "+fmtDateKR(p.createdAt)),p.memo&&e("div",{style:{fontSize:12,color:"#6366f1",marginTop:3}},"📝 "+p.memo)),
          e("div",{style:{display:"flex",gap:5,alignItems:"center"}},

            e("button",{onClick:()=>removePay(p.id),style:{border:"none",background:"none",color:"#cbd5e1",cursor:"pointer",fontSize:14}},"✕"))))})),
    e(Modal,{open:!!memoModal,onClose:()=>setMemoModal(null),title:"청구 메모"},

      e("div",{style:{display:"flex",justifyContent:"flex-end",gap:8}},e(Btn,{variant:"muted",onClick:()=>setMemoModal(null)},"취소"),e(Btn,{onClick:()=>{setPayments(p=>p.map(x=>x.id===memoModal?{...x,memo:memoText}:x));setMemoModal(null)}},"저장")))
  );
}

// ── Calendar ──
function CalendarView({students,sessions,schedules,setSessions}){
  const[month,setMonth]=useState(()=>{const d=new Date();return{year:d.getFullYear(),month:d.getMonth()}});
  const[sel,setSel]=useState(null);
  const vs=useMemo(()=>genVirtual(schedules,sessions,12),[schedules,sessions]);
  const dim=new Date(month.year,month.month+1,0).getDate(),fd=new Date(month.year,month.month,1).getDay();
  const cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  const getDS=day=>{if(!day)return[];const ds=`${month.year}-${String(month.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;return[...sessions,...vs].filter(s=>s.date===ds)};
  const today=new Date(),isT=day=>day&&today.getFullYear()===month.year&&today.getMonth()===month.month&&today.getDate()===day;
  const selS=sel?getDS(sel):[];

  return e("div",null,
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}},
      e("h2",{style:{fontSize:22,fontWeight:800,color:"#0f172a",margin:0}},"캘린더"),
      e("div",{style:{display:"flex",alignItems:"center",gap:12}},
        e("button",{onClick:()=>setMonth(m=>m.month===0?{year:m.year-1,month:11}:{...m,month:m.month-1}),style:{border:"none",background:"none",fontSize:20,cursor:"pointer",color:"#64748b"}},"‹"),
        e("span",{style:{fontSize:16,fontWeight:700,color:"#1e293b",minWidth:110,textAlign:"center"}},month.year+"년 "+(month.month+1)+"월"),
        e("button",{onClick:()=>setMonth(m=>m.month===11?{year:m.year+1,month:0}:{...m,month:m.month+1}),style:{border:"none",background:"none",fontSize:20,cursor:"pointer",color:"#64748b"}},"›"))),
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:6}},DAYS_KR.map(d=>e("div",{key:d,style:{textAlign:"center",fontSize:12,fontWeight:600,color:"#94a3b8",padding:"6px 0"}},d))),
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}},cells.map((day,i)=>{const ds=day?getDS(day):[],act=day===sel;
      return e("div",{key:i,onClick:()=>day&&setSel(day===sel?null:day),style:{minHeight:52,padding:4,borderRadius:8,background:act?"#2563eb":isT(day)?"#eff6ff":"transparent",cursor:day?"pointer":"default"}},
        day&&e("div",null,e("div",{style:{fontSize:13,fontWeight:isT(day)?700:400,color:act?"#fff":isT(day)?"#2563eb":"#334155",textAlign:"center"}},day),
          e("div",{style:{display:"flex",justifyContent:"center",gap:2,flexWrap:"wrap",marginTop:2}},ds.slice(0,3).map((s,j)=>e("div",{key:j,style:{width:6,height:6,borderRadius:3,background:act?"rgba(255,255,255,0.7)":(STATUS_MAP[s.status]?.color||"#059669")}})))))
    })),
    sel&&e("div",{style:{marginTop:16,background:"#f8fafc",borderRadius:12,padding:16}},
      e("div",{style:{fontWeight:700,fontSize:14,color:"#1e293b",marginBottom:10}},(month.month+1)+"월 "+sel+"일"),
      selS.length===0?e("div",{style:{color:"#94a3b8",fontSize:13}},"수업 없음"):selS.map(s=>{const st=students.find(x=>x.id===s.studentId),isV=s.virtual;
        return e("div",{key:s.id,style:{background:isV?"#f0fdf4":"#fff",borderRadius:8,padding:"10px 14px",marginBottom:8,border:`1px solid ${isV?"#bbf7d0":"#e2e8f0"}`}},
          e("div",{style:{display:"flex",alignItems:"center",gap:8,justifyContent:"space-between"}},
            e("div",{style:{display:"flex",alignItems:"center",gap:8}},e("strong",{style:{fontSize:14,color:"#0f172a"}},st?.name),e("span",{style:{fontSize:13,color:"#64748b"}},s.subject),s.time&&e("span",{style:{fontSize:12,color:"#94a3b8"}},s.time),e(Tag,{...(STATUS_MAP[s.status]||STATUS_MAP.scheduled)},(STATUS_MAP[s.status]||STATUS_MAP.scheduled).label)),
            isV&&e("div",{style:{display:"flex",gap:4}},
              e(Btn,{variant:"success",onClick:ev=>{ev.stopPropagation();setSessions(p=>[...p,{id:uid(),studentId:s.studentId,subject:s.subject,date:s.date,time:s.time||"",status:"completed",content:"",nextPlan:"",homework:""}])},style:{padding:"3px 10px",fontSize:11}},"완료"),
              e(Btn,{variant:"danger",onClick:ev=>{ev.stopPropagation();setSessions(p=>[...p,{id:uid(),studentId:s.studentId,subject:s.subject,date:s.date,time:s.time||"",status:"cancelled",content:"",nextPlan:"",homework:""}])},style:{padding:"3px 10px",fontSize:11}},"취소"))))}))
  );
}

// ── Main App ──
function App(){
  const[tab,setTab]=useState("dashboard");
  const[students,setStudents]=useState([]);
  const[sessions,setSessions]=useState([]);
  const[payments,setPayments]=useState([]);
  const[schedules,setSchedules]=useState([]);
  const[loaded,setLoaded]=useState(false);
  const[notifs,setNotifs]=useState([]);

  useEffect(()=>{const d=loadData();setStudents(d.students||[]);setSessions(d.sessions||[]);setPayments(d.payments||[]);setSchedules(d.schedules||[]);setLoaded(true)},[]);
  useEffect(()=>{if(loaded)saveData({students,sessions,payments,schedules})},[students,sessions,payments,schedules,loaded]);

  // In-app notifications on load
  useEffect(()=>{if(!loaded)return;const n=[],today=fmtDate(new Date());
    const todayCount=[...sessions,...genVirtual(schedules,sessions,1)].filter(s=>s.date===today).length;
    if(todayCount>0)n.push({type:"info",icon:"📚",text:`오늘 수업 ${todayCount}개 있어요`});
    const unpaid=payments.filter(p=>!p.paid).length;
    if(unpaid>0)n.push({type:"danger",icon:"💰",text:`미납 청구 ${unpaid}건이 있어요`});
    const three=new Date();three.setDate(three.getDate()+1);const tmr=fmtDate(three);
    const tmrCount=[...sessions,...genVirtual(schedules,sessions,1)].filter(s=>s.date===tmr).length;
    if(tmrCount>0)n.push({type:"warning",icon:"📅",text:`내일 수업 ${tmrCount}개 예정이에요`});
    setNotifs(n)},[loaded]);

  // Periodic check while app is open (every 60s)
  useEffect(()=>{if(!loaded)return;const iv=setInterval(()=>{const now=new Date();
    sessions.forEach(s=>{if(s.time&&s.date===fmtDate(now)){const[h,m]=s.time.split(":").map(Number);const diff=(h*60+m)-(now.getHours()*60+now.getMinutes());
      if(diff>0&&diff<=30){const st=students.find(x=>x.id===s.studentId);
        setNotifs(prev=>{if(prev.some(n=>n.text.includes(st?.name)&&n.text.includes("분 후")))return prev;
          return[{type:"warning",icon:"⏰",text:`${st?.name} ${s.subject} 수업 ${diff}분 후`},...prev]})}}})},60000);return()=>clearInterval(iv)},[loaded,sessions,students]);

  const dismissNotif=i=>setNotifs(p=>p.filter((_,j)=>j!==i));

  if(!loaded)return e("div",{style:{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",color:"#94a3b8"}},"불러오는 중...");

  return e("div",{style:{background:"#f7f8fa",minHeight:"100vh"}},
    e("div",{style:{maxWidth:640,margin:"0 auto",padding:"0 16px 100px"}},
      e("div",{style:{padding:"20px 0 16px",textAlign:"center"}},e("h1",{style:{fontSize:20,fontWeight:800,color:"#0f172a",margin:0}},"과외 매니저")),
      tab==="dashboard"&&e(Dashboard,{students,sessions,payments,schedules,setTab,notifications:notifs,onDismissNotif:dismissNotif}),
      tab==="students"&&e(Students,{students,setStudents,sessions,schedules,setSchedules}),
      tab==="sessions"&&e(Sessions,{students,sessions,setSessions,schedules}),
      tab==="payments"&&e(Payments,{students,sessions,payments,setPayments,schedules}),
      tab==="calendar"&&e(CalendarView,{students,sessions,schedules,setSessions})),
    e("nav",{style:{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #e2e8f0",padding:"6px 0 env(safe-area-inset-bottom,8px)",display:"flex",justifyContent:"center",zIndex:50}},
      e("div",{style:{display:"flex",maxWidth:640,width:"100%",justifyContent:"space-around"}},
        TABS.map(t=>e("button",{key:t.id,onClick:()=>setTab(t.id),style:{border:"none",background:"none",cursor:"pointer",padding:"6px 8px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:tab===t.id?"#2563eb":"#94a3b8"}},
          e("span",{style:{fontSize:20}},t.icon),e("span",{style:{fontSize:10,fontWeight:600}},t.label))))));
}

// Register SW & render
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
ReactDOM.render(e(App),document.getElementById("root"));
</script>
