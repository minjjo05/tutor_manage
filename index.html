function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fd(d){if(!d)return"";const t=new Date(d);return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`}
function fk(d){if(!d)return"";const t=new Date(d);return`${t.getMonth()+1}/${t.getDate()} (${DK[t.getDay()]})`}

function isPast(s){const n=new Date(),d=new Date(s.date+"T00:00:00");if(s.time){const[h,m]=s.time.split(":").map(Number);d.setHours(h,m)}else d.setHours(23,59);return d<n}
function genV(sch,ses,w=8){const v=[],td=new Date();td.setHours(0,0,0,0);for(let i=0;i<w*7;i++){const d=new Date(td);d.setDate(d.getDate()+i);sch.filter(s=>s.active).forEach(sc=>{if(d.getDay()!==sc.dayOfWeek)return;const st=new Date(sc.startDate);st.setHours(0,0,0,0);if(d<st)return;const ds=fd(d);if(!ses.some(s=>s.studentId===sc.studentId&&s.subject===sc.subject&&s.date===ds))v.push({id:`v_${sc.id}_${ds}`,studentId:sc.studentId,subject:sc.subject,date:ds,time:sc.time,status:"scheduled",content:"",nextPlan:"",homework:"",virtual:true})})}return v}
function getSN(s,ses){if(s.virtual||s.status==="cancelled")return null;return ses.filter(x=>x.studentId===s.studentId&&x.subject===s.subject&&(x.status==="completed"||x.status==="makeup"||x.status==="rescheduled")&&(x.date<s.date||(x.date===s.date&&x.id<=s.id))).length}
function getSNv(s,ses){return ses.filter(x=>x.studentId===s.studentId&&x.subject===s.subject&&(x.status==="completed"||x.status==="makeup"||x.status==="rescheduled")&&x.date<s.date).length+1}

const RT={session:{label:"회당"},hourly:{label:"시급"}};

function rateLabel(sub){if(!sub||!sub.rate)return"미정";return sub.rateType==="hourly"?Number(sub.rate).toLocaleString()+"원/시간 ("+(Number(sub.duration)||60)+"분·"+sessAmt(sub).toLocaleString()+"원)":Number(sub.rate).toLocaleString()+"원/회"}
function ld(){try{const d=localStorage.getItem(SK);return d?JSON.parse(d):{}}catch(e){return{}}}

function fmtPhone(v){const d=v.replace(/\D/g,"").slice(0,11);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+"-"+d.slice(3);return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7)}

// PDF export
function exportPDF(st,ses,pay){
  const stSes=ses.filter(s=>s.studentId===st.id).sort((a,b)=>a.date.localeCompare(b.date));
  const stPay=pay.filter(p=>p.studentId===st.id);
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${st.name} 수업 일지</title><style>body{font-family:-apple-system,sans-serif;padding:30px;font-size:14px}h1{font-size:22px;margin-bottom:4px}h2{font-size:16px;margin:20px 0 8px;border-bottom:2px solid #2563eb;padding-bottom:4px}table{width:100%;border-collapse:collapse;margin-bottom:16px}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px}th{background:var(--card-alt2);font-weight:600}.sub{color:#64748b;font-size:13px;margin-bottom:20px}</style></head><body>`;
  html+=`<h1>${st.name} 수업 일지</h1><div class="sub">${st.subjects.map(s=>s.name+"("+rateLabel(s)+")").join(", ")} · ${PM[st.paymentMode||"per_subject"].label} · 출력일: ${fd(new Date())}</div>`;
  html+=`<h2>📝 수업 기록 (${stSes.length}회)</h2><table><tr><th>날짜</th><th>과목</th><th>상태</th><th>수업 내용</th><th>숙제</th></tr>`;
  stSes.forEach(s=>{html+=`<tr><td>${fk(s.date)}${s.time?" "+s.time:""}</td><td>${s.subject}</td><td>${SM[s.status]?.label||s.status}</td><td>${s.content||"-"}</td><td>${s.homework||"-"}</td></tr>`});
  html+=`</table>`;
  if(stPay.length){html+=`<h2>💰 수업료 내역</h2><table><tr><th>구분</th><th>횟수</th><th>금액</th><th>상태</th><th>메모</th></tr>`;stPay.forEach(p=>{html+=`<tr><td>${p.subject}${p.monthKey?" ("+parseInt(p.monthKey.slice(5))+"월)":""}</td><td>${p.sessionCount}회</td><td>${p.amount.toLocaleString()}원</td><td>${p.paid?"납부":"미납"}</td><td>${p.memo||"-"}</td></tr>`});html+=`</table>`}
  html+=`</body></html>`;
  // Print via a hidden same-page iframe instead of window.open("_blank") — opening a new
  // tab/window kicks an iOS home-screen (standalone) PWA out of the app back to Safari.
  // Printing from an iframe keeps everything inside the current app window.
  const old=document.getElementById("__pdfFrame");if(old)old.remove();
  const iframe=document.createElement("iframe");
  iframe.id="__pdfFrame";
  iframe.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0";
  document.body.appendChild(iframe);
  const doc=iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
  const cleanup=()=>{if(iframe.parentNode)iframe.parentNode.removeChild(iframe)};
  iframe.contentWindow.onafterprint=cleanup;
  setTimeout(()=>{
    try{iframe.contentWindow.focus();iframe.contentWindow.print()}catch(err){}
    // Fallback cleanup in case onafterprint doesn't fire (some iOS versions)
    setTimeout(cleanup,15000);
  },300);
}

function Dashboard({students:sts,sessions:ses,setSessions:setSes,payments:pay,schedules:sch,exams,setTab,notifs,onDN,settings,setSettings,navAction,setNavAction}){
  const td=fd(new Date()),vs=genV(sch,ses,1),tdS=[...ses,...vs].filter(s=>s.date===td),upP=pay.filter(p=>!p.paid),comp=ses.filter(s=>s.status==="completed"||(s.status==="makeup"||s.status==="rescheduled")&&s.date<=td),[dm,setDm]=useState(null),[expUp,setExpUp]=useState({});
  const[cmpModal,setCmpModal]=useState(null),[cmpForm,setCmpForm]=useState({content:"",homework:"",nextPlan:""});
  useEffect(()=>{if(navAction==="today"){setDm("today");setNavAction(null)}},[navAction]);
  // Monthly income summary
  const curYM=td.slice(0,7),monthPaid=pay.filter(p=>p.paid&&(p.paidDate||p.createdAt||"").slice(0,7)===curYM).reduce((a,p)=>a+p.amount,0),monthExpect=sts.filter(s=>!s.archived).reduce((a,st)=>{const mode=st.paymentMode||"per_subject";if(mode==="monthly_fixed")return a+(Number(st.fixedAmount)||0);return a+sch.filter(sc=>sc.studentId===st.id&&sc.active).reduce((t,sc)=>{const sub=st.subjects.find(s=>s.name===sc.subject);if(!sub)return t;const[y,m]=curYM.split("-").map(Number),dim=new Date(y,m,0).getDate(),start=new Date(sc.startDate);start.setHours(0,0,0,0);let c=0;for(let d=1;d<=dim;d++){const dt=new Date(y,m-1,d);if(dt.getDay()===sc.dayOfWeek&&dt>=start)c++}return t+c*sessAmt(sub)},0)},0);
  const vsUp=genV(sch,ses,8);
  const resch=ses.filter(s=>(s.status==="rescheduled"||s.status==="makeup")&&s.date>=td);
  const todayDone=ses.filter(s=>s.date===td&&s.status!=="rescheduled"&&s.status!=="makeup");
  const upRaw=[...vsUp,...resch,...todayDone].filter(s=>s.date>=td);
  const todayUp=upRaw.filter(s=>s.date===td);
  const futureRaw=upRaw.filter(s=>s.date>td);
  const nearestByStudent={};
  futureRaw.forEach(s=>{const key=s.date+" "+(s.time||"99:99"),gk=s.studentId+"_"+s.subject,cur=nearestByStudent[gk];if(!cur||key<(cur.date+" "+(cur.time||"99:99")))nearestByStudent[gk]=s});
  const todayKeys=new Set(todayUp.map(s=>s.studentId+"_"+s.subject));
